# Security gates: SAST (Semgrep) and dependency vulnerabilities (Trivy).
#
# Adapted and modified from northraystudio/maruda
# (MIT, Copyright (c) 2026 NorthRay Studio株式会社):
#   https://github.com/northraystudio/maruda/blob/99dd7981e7947e4ae500225f811f5db0a03c3c7e/harness/templates/github/security-scan.yml#L45-L84
# sunaba changes: Semgrep runs with `--error` (without it, findings exit 0
# and the gate never fails), from a digest-pinned image, with metrics off.
# Trivy runs from a pinned, SHA-256-verified release binary instead of
# trivy-action (see GHSA-69fq-xp46-6x23), covers every lockfile type, and
# replaces the npm/pnpm audit job. Informational mode is a green,
# annotated job instead of `continue-on-error`, so it can be a required
# check from day one; the mode lives in a repository variable. Unknown exit
# codes fail closed. The MIT license
# notice is in docs/security/THIRD_PARTY_NOTICES.md.
#
# No `paths:` filters on purpose: a required check whose workflow is
# skipped stays "Pending" and blocks the merge.
#
# Supply chain: actions are pinned to commit SHAs (Dependabot's
# github-actions ecosystem keeps them current). The Semgrep image digest
# and TRIVY_VERSION / TRIVY_SHA256 are NOT Dependabot-managed; bump them
# by hand (docs/security/README.md, "Updating the scanners").
#
# Maturity ladder: docs/security/README.md.
name: security-scan

on:
  pull_request:
  push:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan
        # Exit 0: clean. 1: findings (blocks). 2+: Semgrep failed (blocks).
        # For a false positive, add `# nosemgrep: <rule-id>` with a reason on
        # that line; never exclude whole source directories.
        run: |
          semgrep scan --error --metrics=off \
            --config p/security-audit \
            --config p/owasp-top-ten \
            .

  trivy:
    name: Dependency Scan (Trivy)
    # The install step downloads the Linux-64bit build; keep an x64 image.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # Stage 0 (default): HIGH/CRITICAL findings are warnings; the job stays
      # green. Stage 1: `gh variable set SUNABA_TRIVY_BLOCKING --body true`.
      # A repository variable, so `sunaba rebuild` cannot reset it.
      TRIVY_BLOCKING: ${{ vars.SUNABA_TRIVY_BLOCKING || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy (pinned, SHA-256 verified)
        env:
          TRIVY_VERSION: 0.74.0
          TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl -sSfL --retry 3 --connect-timeout 10 --max-time 120 -o "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" trivy
          "$RUNNER_TEMP/bin/trivy" --version | grep -qx "Version: ${TRIVY_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Download vulnerability database
        # The DB is fetched live (mirror.gcr.io, then ghcr.io); retry transient
        # registry errors, then fail closed.
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            trivy fs --download-db-only --no-progress . && exit 0
            [ "$attempt" -lt 3 ] && sleep $((attempt * 20))
          done
          echo "::error title=Trivy did not complete::could not download the vulnerability database"
          exit 1

      - name: Scan lockfiles
        run: |
          set -uo pipefail
          case "$TRIVY_BLOCKING" in
            true|false) ;;
            *) echo "::error title=Trivy::SUNABA_TRIVY_BLOCKING must be \"true\" or \"false\", got \"$TRIVY_BLOCKING\""; exit 1 ;;
          esac
          report="$RUNNER_TEMP/trivy.json"
          # Findings exit 3; any other non-zero code is a Trivy failure.
          trivy fs --skip-db-update --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 3 --no-progress --format json --output "$report" .
          code=$?
          if [ "$code" != 0 ] && [ "$code" != 3 ]; then
            echo "::error title=Trivy did not complete::trivy exited with code $code; the scan result is not trustworthy"
            exit 1
          fi
          trivy convert --format table --table-mode detailed "$report"
          read -r targets findings < <(jq -r '"\((.Results // []) | length) \([.Results[]?.Vulnerabilities[]?] | length)"' "$report")
          db="$(trivy version --format json | jq -r '.VulnerabilityDB.UpdatedAt // "unknown"')"
          {
            echo "### Dependency Scan (Trivy)"
            echo "- Mode: $([ "$TRIVY_BLOCKING" = true ] && echo blocking || echo 'informational (SUNABA_TRIVY_BLOCKING=false)')"
            echo "- Dependency files scanned: $targets"
            echo "- HIGH/CRITICAL findings with a fix: $findings"
            echo "- Vulnerability DB updated: $db"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "$targets" = 0 ]; then
            echo "::notice title=Trivy::No supported dependency files (lockfiles) found; nothing was checked"
          fi
          if [ "$code" = 3 ]; then
            if [ "$TRIVY_BLOCKING" = true ]; then
              echo "::error title=Trivy::$findings HIGH/CRITICAL vulnerabilities with a fix available"
              exit 1
            fi
            echo "::warning title=Trivy (informational)::$findings HIGH/CRITICAL vulnerabilities with a fix available. Set the repository variable SUNABA_TRIVY_BLOCKING to true to make this gate block."
          fi
