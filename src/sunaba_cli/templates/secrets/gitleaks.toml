# Gitleaks configuration. Loaded automatically from the repository root by
# the pre-commit hook, the CI workflow, and a manual `gitleaks git`.
#
# The [extend] block and the allowlist policy below are adapted from
# northraystudio/maruda (MIT, Copyright (c) 2026 NorthRay Studio株式会社):
#   https://github.com/northraystudio/maruda/blob/99dd7981e7947e4ae500225f811f5db0a03c3c7e/harness/templates/github/gitleaks.toml
# The MIT license notice is in docs/secrets/THIRD_PARTY_NOTICES.md.
title = "sunaba generated gitleaks config"

# Inherit gitleaks' default rules. Without this block a custom config
# REPLACES the defaults and detects nothing.
[extend]
useDefault = true

# No file is allowlisted — not even .env.example. Placeholder values
# (`OPENAI_API_KEY=`, `your-api-key`, `changeme`) do not match the default
# rules, and a real key pasted into an example file must still be caught.
#
# For a false positive, allowlist the smallest possible unit: one
# finding's fingerprint in .gitleaksignore (preferred), or an exact regex
# or stopword here. Never allowlist whole files or directories — that
# becomes a secret-scan bypass. `[[allowlists]]` needs gitleaks >= 8.25.
#
# [[allowlists]]
# description = "Explain why each entry is a deterministic non-secret"
# regexes = ['''^0123456789abcdef0123456789abcdef$''']
