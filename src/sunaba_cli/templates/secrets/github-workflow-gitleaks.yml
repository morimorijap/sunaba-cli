# Secret scan with gitleaks: the commits a pull request adds, the full
# history of every pushed ref, and every ref on a manual run.
#
# Adapted and modified from northraystudio/maruda
# (MIT, Copyright (c) 2026 NorthRay Studio株式会社):
#   https://github.com/northraystudio/maruda/blob/99dd7981e7947e4ae500225f811f5db0a03c3c7e/harness/templates/github/security-scan.yml#L22-L43
# sunaba changes: `gitleaks git` (current subcommand) instead of
# `gitleaks detect`, `--redact` so matches never reach the Actions log,
# per-event scan ranges, fail-closed handling of git errors, ignoring
# inline `gitleaks:allow`, least-privilege `permissions`, a root-free
# install, and a pinned runner image. The MIT license notice is in
# docs/secrets/THIRD_PARTY_NOTICES.md.
#
# Supply chain: every action is pinned to a full commit SHA (Dependabot's
# github-actions ecosystem keeps the SHA and its `# vX.Y.Z` comment
# current), and the gitleaks release archive is SHA-256 verified before
# it runs. Dependabot does NOT update GITLEAKS_VERSION / GITLEAKS_SHA256:
# when bumping, take the SHA-256 from the release's
# gitleaks_<version>_checksums.txt and move the `rev:` in
# .pre-commit-config.yaml to the same release.
#
# A repository that leaked a secret in the past fails the full-history
# scan until the secret is rotated and that finding's fingerprint is added
# to .gitleaksignore. See docs/secrets/README.md.
name: gitleaks

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secret Scan (Gitleaks)
    # The install step downloads the linux_x64 build; keep an x64 image.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, SHA-256 verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL --retry 3 --connect-timeout 10 --max-time 120 -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bin" gitleaks
          test "$("$RUNNER_TEMP/bin/gitleaks" version)" = "$GITLEAKS_VERSION"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            # Every commit the PR adds, including one that adds and later
            # removes a secret.
            pull_request) range="${BASE_SHA}..${HEAD_SHA}" ;;
            # Manual runs sweep every fetched ref.
            workflow_dispatch) range="--all" ;;
            # Push: the full history of the pushed ref.
            *) range="" ;;
          esac
          log="$RUNNER_TEMP/gitleaks.log"
          # --no-ext-diff / --no-textconv: repository-configured diff helpers
          # cannot rewrite what gitleaks sees. --ignore-gitleaks-allow: an
          # inline `gitleaks:allow` comment in a PR cannot suppress a finding;
          # use a reviewed .gitleaksignore fingerprint instead.
          gitleaks git --redact --verbose --no-color --ignore-gitleaks-allow \
            --log-opts="--no-ext-diff --no-textconv${range:+ $range}" . 2>&1 | tee "$log"
          # gitleaks exits 0 and reports "no leaks found" when git itself
          # fails (gitleaks/gitleaks#2129), so any ERR line fails the job.
          if grep -Eq '^[^ ]+ ERR ' "$log"; then
            echo "::error title=gitleaks did not complete::git reported errors; the scan result is not trustworthy"
            exit 1
          fi
